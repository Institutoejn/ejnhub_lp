name: Publicar EJNHUB LP no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          mkdir _site
          cp index.html styles.css main.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a página publicada
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          site_url="${PAGE_URL%/}"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$site_url/" -o /tmp/ejnhub-page.html
          python3 - <<'PYTEST'
          from pathlib import Path
          page = Path('/tmp/ejnhub-page.html').read_text()
          assert '<title>EJNHUB — Gestão que acompanha a transformação</title>' in page
          PYTEST
          for asset in styles.css main.js assets/ejn-logo.png; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$site_url/$asset" -o /dev/null
          done
